{% extends 'base.html' %}

{% block title %}Donation Successful | NPP Ghana{% endblock %}

{% block content %}
<section class="py-20 bg-green-50">
  <div class="max-w-2xl mx-auto px-6 text-center">
    <div class="bg-white rounded-2xl shadow-xl p-10">
      <div class="text-6xl text-green-500 mb-6">✓</div>
      <h1 class="text-3xl font-bold text-gray-800 mb-4">Thank You!</h1>
      <p class="text-lg text-gray-600 mb-6">
        Your donation of <strong>GHS {{ donation.amount }}</strong> was successful.
      </p>
      <p class="text-sm text-gray-500 mb-8">
        Reference: {{ donation.reference }}
      </p>
      <a href="{% url 'home' %}" class="bg-red-700 hover:bg-red-800 text-white px-8 py-3 rounded-full font-semibold transition">
        Back to Homepage
      </a>
    </div>
  </div>
</section>
{% endblock %}
