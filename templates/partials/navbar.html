             onerror="this.src='https://via.placeholder.com/48/A00D1E/FFFFFF?text=NPP'">

          <h1 class="text-2xl font-extrabold text-red-700 tracking-tight leading-none">NEW PATRIOTIC PARTY</h1>

      <button type="button" onclick="toggleMenu()" class="lg:hidden text-gray-700 hover:text-red-700 focus:outline-none" aria-label="Menu">

  <!-- Mobile Menu -->
  <div id="mobileMenu" class="hidden lg:hidden bg-white border-t border-gray-100">

<style>
  .nav-link::after {
    content: '';
    position: absolute;
    width: 0;
    height: 2px;
    bottom: -4px;
    left: 0;
    background-color: #b91c1c;
    transition: width 0.3s ease;
  }
  .nav-link:hover::after {
    width: 100%;
  }
</style>

<script>
  function toggleMenu() {
    const menu = document.getElementById('mobileMenu');
    if (menu) menu.classList.toggle('hidden');
  }
</script>
