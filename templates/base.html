{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NPP Ghana | Development in Freedom{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    html { scroll-behavior: smooth; }
    .hero { background-size: cover; background-position: center; }
  </style>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-800">

  {% include 'partials/navbar.html' %}

  {% block content %}{% endblock %}

  {% include 'partials/footer.html' %}

  <!-- WhatsApp Floating Button -->
  <a href="https://wa.me/233204799202" target="_blank"
     class="fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white w-14 h-14 rounded-full flex items-center justify-center text-3xl shadow-lg z-50 transition transform hover:scale-110">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('hidden');
    }
  </script>

</body>
</html>
